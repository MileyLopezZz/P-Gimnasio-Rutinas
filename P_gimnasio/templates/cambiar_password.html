{% extends 'base.html' %}

{% block titulo %}
    Cambiar contraseña | Gimnasio y rutinas
{% endblock %}

{% block contenido %}

<div class="acceso-tarjeta">
    <h2>Cambiar contraseña</h2>

    <p class="acceso-descripcion">
        Escribe tu contraseña actual y confirma la nueva.
    </p>

    <form method="post" action="{% url 'cambiar_password' %}" class="acceso-formulario">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="boton boton-principal">
            Guardar nueva contraseña
        </button>
    </form>

    <p class="acceso-enlace">
        <a href="{% url 'cuenta' %}">
            Cancelar y volver a mi cuenta
        </a>
    </p>
</div>

{% endblock %}
